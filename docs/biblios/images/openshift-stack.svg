<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="700" viewBox="0 0 1060 700" role="img" aria-labelledby="title desc">
<title id="title">Datenportal auf OpenShift</title>
<desc id="desc">Browser greifen über den TLS-Router und APISIX auf Editor, Dokumentation, Jenkins und Sodata zu. Jenkins liest Git und schreibt in externes S3. Sodata und Browser lesen die öffentliche Auslieferung. CRC verwendet lokale Anmeldung, das Betreiber-Overlay AD.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#47647c"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#19354b;font-size:16px}.title{font-size:25px;font-weight:bold}.head{font-size:18px;font-weight:bold}.small{font-size:14px}.box{fill:#fff;stroke:#95acbd;stroke-width:1.5;rx:10}.line{fill:none;stroke:#47647c;stroke-width:2;marker-end:url(#arrow)}.muted{fill:#466176}</style>
